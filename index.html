<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domarti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="header__top-line">
      <div class="header__top-container">
        <div class="header__top-group">
          <span>Кухни и мебель под заказ в Самаре</span>
          <span>•</span>
          <span>Работаем с 2006 года</span>
        </div>
        <div class="header__top-group header__top-group--right">
          <a href="#">Акции</a>
          <a href="#">Кредит</a>
          <a href="#">Дизайнерам</a>
        </div>
      </div>
    </div>

    <div class="header__middle-line">
      <div class="header__middle-container">
        <button class="icon-btn icon-btn--menu" type="button" aria-label="Меню">
          <svg class="icon"><use href="assets/icons/sprite.svg#hamburger"></use></svg>
        </button>

        <a href="/" class="header__logo">
          <img src="assets/logo.svg" alt="Domarti">
        </a>

        <div class="header__tablet-actions">
          <button class="icon-btn" type="button" aria-label="Позвонить">
            <svg class="icon"><use href="assets/icons/sprite.svg#call"></use></svg>
          </button>
          <button class="btn btn--brand" type="button">Бесплатный замер</button>
          <button class="icon-btn icon-btn--cart" type="button" aria-label="Корзина">
            <svg class="icon"><use href="assets/icons/sprite.svg#cart"></use></svg>
          </button>
          <button class="icon-btn" type="button" aria-label="Поиск">
            <svg class="icon"><use href="assets/icons/sprite.svg#search"></use></svg>
          </button>
        </div>

        <nav class="header__nav">
          <button class="btn btn--stroke" type="button">
            <svg class="icon"><use href="assets/icons/sprite.svg#hamburger"></use></svg>
            <span>Каталог</span>
          </button>
          <a class="menu-item" href="#"><span class="menu-item__label">Наши работы</span></a>
          <a class="menu-item menu-item--dropdown" href="#">
            <span class="menu-item__label">О компании</span>
            <svg class="icon icon--16"><use href="assets/icons/sprite.svg#angle-down"></use></svg>
          </a>
          <a class="menu-item" href="#"><span class="menu-item__label">Контакты</span></a>
        </nav>

        <div class="header__contacts">
          <div class="header__phone">
            <a class="header__phone-number" href="tel:+79270112793">+7 (927) 011-27-93</a>
            <a class="header__email" href="mailto:info@samara.kitchen">info@samara.kitchen</a>
          </div>
          <div class="header__socials">
            <a href="#" aria-label="WhatsApp"><svg class="icon"><use href="assets/icons/sprite.svg#whatsapp"></use></svg></a>
            <a href="#" aria-label="MAX"><svg class="icon"><use href="assets/icons/sprite.svg#max"></use></svg></a>
            <a href="#" aria-label="Telegram"><svg class="icon"><use href="assets/icons/sprite.svg#telegram"></use></svg></a>
          </div>
          <div class="header__actions">
            <button class="btn btn--brand" type="button">Бесплатный замер</button>
            <button class="icon-btn icon-btn--cart" type="button" aria-label="Корзина">
              <svg class="icon"><use href="assets/icons/sprite.svg#cart"></use></svg>
            </button>
          </div>
        </div>

        <button class="icon-btn icon-btn--cart icon-btn--cart-mobile" type="button" aria-label="Корзина">
          <svg class="icon"><use href="assets/icons/sprite.svg#cart"></use></svg>
        </button>
      </div>
    </div>

    <div class="header__bottom-line">
      <div class="header__bottom-container">
        <div class="header__kitchens">
          <a class="menu-item" href="#">
            <svg class="icon icon--18"><use href="assets/icons/sprite.svg#kitchen-p"></use></svg>
            <span class="menu-item__label">П-образные</span>
          </a>
          <a class="menu-item" href="#">
            <svg class="icon icon--18"><use href="assets/icons/sprite.svg#kitchen-simple"></use></svg>
            <span class="menu-item__label">Прямые</span>
          </a>
          <a class="menu-item" href="#">
            <svg class="icon icon--18"><use href="assets/icons/sprite.svg#kitchen-angle"></use></svg>
            <span class="menu-item__label">Угловые</span>
          </a>
          <a class="menu-item" href="#">
            <svg class="icon icon--18"><use href="assets/icons/sprite.svg#kitchen-isle"></use></svg>
            <span class="menu-item__label">С островом</span>
          </a>
        </div>

        <span class="header__separator"></span>

        <div class="header__styles">
          <a class="menu-item" href="#"><span class="menu-item__label">Классика</span></a>
          <a class="menu-item" href="#"><span class="menu-item__label">Современные</span></a>
          <a class="menu-item" href="#"><span class="menu-item__label">Модерн</span></a>
          <a class="menu-item" href="#"><span class="menu-item__label">Лофт</span></a>
        </div>

        <span class="header__separator"></span>

        <a class="menu-item" href="#"><span class="menu-item__label">Калькулятор</span></a>

        <a class="header__search" href="#">
          <span>Поиск</span>
          <svg class="icon"><use href="assets/icons/sprite.svg#search"></use></svg>
        </a>
      </div>
    </div>
  </header>

  <script src="js/main.js"></script>
</body>
</html>
