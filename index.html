<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДОМАРТИ — Страницы</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 96px 64px;
      background: #fff;
      font-family: "Montserrat", sans-serif;
      color: #1f1e1e;
    }

    .page {
      max-width: 480px;
    }

    .page__eyebrow {
      margin: 0 0 12px;
      color: #726e6e;
      font-weight: 600;
      font-size: 0.8125rem;
      line-height: 1.25rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .page__title {
      margin: 0 0 40px;
      color: #1f1e1e;
      font-weight: 700;
      font-size: 1.75rem;
      line-height: 2.25rem;
    }

    .page__list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #e0e0e0;
    }

    .page__list li {
      border-bottom: 1px solid #e0e0e0;
    }

    .page__list a {
      display: block;
      padding: 18px 0;
      color: #1f1e1e;
      font-weight: 500;
      font-size: 1rem;
      line-height: 1.5rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .page__list a:hover {
      color: #be9460;
    }
  </style>
</head>
<body>

  <div class="page">
    <p class="page__eyebrow">Domarti</p>
    <h1 class="page__title">Сверстанные страницы</h1>
    <ul class="page__list">
      <li><a href="home.html">Главная</a></li>
      <li><a href="Page404.html">404</a></li>
    </ul>
  </div>

</body>
</html>
